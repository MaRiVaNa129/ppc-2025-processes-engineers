name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM every day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build && cd build
          cmake ..
          make -j4
