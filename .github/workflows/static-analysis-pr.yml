name: Static Analysis

on:
  pull_request:
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hh'
      - '**.hpp'
      - '**.hxx'

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive   # <-- ВАЖНО: загружаем json и другие submodule!

      - name: Run clang-tidy
        uses: ./.github/actions/clang-tidy-native
        with:
          build_dir: build
